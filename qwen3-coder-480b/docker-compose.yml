services:
  vllm-qwen3-coder-480b:
    image: vllm/vllm-openai:latest
    container_name: vllm-qwen3-coder-480b
    ipc: host
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_DEVICE_IDS:-0,1,2,3,4,5,6,7}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE_DIR:-/data/models/huggingface}:/root/.cache/huggingface
    command:
      - --model
      - ${MODEL_NAME:-Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8}
      - --tensor-parallel-size
      - "${TENSOR_PARALLEL_SIZE:-4}"
      - --pipeline-parallel-size
      - "${PIPELINE_PARALLEL_SIZE:-2}"
      - --max-model-len
      - "${MAX_MODEL_LEN:-131072}"
      - --served-model-name
      - ${SERVED_MODEL_NAME:-qwen3-coder-480b}
      - --enable-auto-tool-choice
      - --tool-call-parser
      - ${TOOL_CALL_PARSER:-qwen3_coder}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
