services:
  vllm-qwen-coder:
    image: vllm/vllm-openai:latest
    container_name: vllm-qwen-coder
    ipc: host
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8123}:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_DEVICE_IDS:-6,7}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE_DIR:-/data/models/huggingface}:/root/.cache/huggingface
    command:
      - --model
      - ${MODEL_NAME:-Qwen/Qwen2.5-Coder-32B-Instruct}
      - --tensor-parallel-size
      - "${TENSOR_PARALLEL_SIZE:-2}"
      - --max-model-len
      - "${MAX_MODEL_LEN:-32768}"
      - --served-model-name
      - ${SERVED_MODEL_NAME:-qwen-coder-32b}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
